name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ১. গিটহাব থেকে কোড চেকআউট করা
      - name: Checkout code
        uses: actions/checkout@v4

      # ২. নোড জেএস সেটআপ করা (ক্যাশ বাদ দেওয়া হয়েছে)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ৩. ডিপেন্ডেন্সি ইনস্টল করা (npm ci এর জায়গায় npm i)
      - name: Install dependencies
        run: npm install 

      # ৪. প্রোজেক্ট বিল্ড করা
      - name: Build project
        run: npm run build

      # ৫. ফায়ারবেস টুলস ইনস্টল ও নির্দিষ্ট সাইট ডেপ্লয় করা
      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting:iptv99 --project my-project-c71d4 --token "$FIREBASE_TOKEN"
