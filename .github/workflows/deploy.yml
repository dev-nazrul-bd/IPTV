name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main # আপনার মেইন ব্রাঞ্চের নাম অনুযায়ী পরিবর্তন করতে পারেন

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ১. গিটহাব থেকে কোড চেকআউট করা
      - name: Checkout code
        uses: actions/checkout@v4

      # ২. সরাসরি ফায়ারবেস হোস্টিংয়ে ডেপ্লয় করা
      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting:iptv99 --project my-project-c71d4 --token "$FIREBASE_TOKEN"
