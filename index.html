        var player = videojs('live-player', {

            autoplay: true,
            muted: false
        });

        // বাটন গ্রিড ডাইনামিকালি জেনারেট করার লজিক
        const buttonGrid = document.getElementById('channelButtons');
        channels.forEach((channel, index) => {
            const btn = document.createElement('button');
            btn.className = 'channel-btn';
            if (index === 0) btn.className += ' active';
            btn.innerText = channel.name;
            btn.title = channel.name; // মাউস রাখলে পুরো নাম দেখাবে
            btn.onclick = () => changeChannel(channel.url, btn);
            buttonGrid.appendChild(btn);
        });

        // প্রথম চ্যানেলটি ডিফল্ট হিসেবে পেজ লোডে চালু হবে
        window.onload = function() {
            if(channels.length > 0) {
                const firstBtn = buttonGrid.querySelector('.channel-btn');
                changeChannel(channels[0].url, firstBtn);
            }
        };

        // চ্যানেল পরিবর্তন ফাংশন
        function changeChannel(streamUrl, element) {
            const buttons = document.querySelectorAll('.channel-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            if(element) element.classList.add('active');

            var streamType = 'application/x-mpegURL'; // HLS (.m3u8)
            if (streamUrl.includes('.mpd')) {
                streamType = 'application/dash+xml'; // DASH (.mpd)
            }

            player.src({
                src: streamUrl,
                type: streamType
            });
            player.load();
            
            player.play().catch(function(error) {
                console.log("Autoplay was prevented by browser.");
            });
        }

        // ফুলস্ক্রিন ও ওরিয়েন্টেশন রোটেশন লজিক
        function goFullScreenAndRotate() {
            var playerElement = document.getElementById('live-player');
            
            if (playerElement.requestFullscreen) {
                playerElement.requestFullscreen();
            } else if (playerElement.mozRequestFullScreen) {
                playerElement.mozRequestFullScreen();
            } else if (playerElement.webkitRequestFullscreen) {
                playerElement.webkitRequestFullscreen();
            } else if (playerElement.msRequestFullscreen) {
                playerElement.msRequestFullscreen();
            }

            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(function(error) {
                    console.log("Orientation lock not supported on this device.");
                });
            }
        }
