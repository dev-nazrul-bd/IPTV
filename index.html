    <style>
        :root {
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --text-muted: #666666;
            --border-color: #dddddd;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Profile Section */


        /* Main Container */


        h2 {
            color: var(--text-color);
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .selector-box {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 600;
        }

        select {
            background: #ffffff;
            color: var(--text-color);
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 10px rgba(0, 123, 255, 0.15);
        }

        /* Video Player Wrapper */
        .video-wrapper {
            position: relative;
            background-color: #000000;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .video-js {
            width: 100% !important;
            aspect-ratio: 16/9;
        }

        /* Action Buttons */
        .control-actions {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }

        .fullscreen-btn {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-hover) 100%);
            color: #ffffff;
            border: none;
            padding: 12px 30px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
            transition: all 0.2s ease;
        }

        .fullscreen-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 123, 255, 0.4);
        }

        .fullscreen-btn:active {
            transform: translateY(0);
        }

        /* Developer Footer */

    </style>
</head>

        <!-- Rotation & Fullscreen Button -->

    <!-- Video.js Script -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

    <script>
        // Player Initialization
        var player = videojs('live-player', {
            fluid: true,
            autoplay: true,
            muted: false
        });

        // Auto play the selected channel on page load
        window.onload = function() {
            changeChannel();
        };

        // Function to change channel stream
        function changeChannel() {
            var select = document.getElementById("channelSelect");
            var streamUrl = select.value;
            
            var streamType = 'application/x-mpegURL'; // HLS (.m3u8)
            if (streamUrl.endsWith('.mpd')) {
                streamType = 'application/dash+xml'; // DASH (.mpd)
            }

            player.src({
                src: streamUrl,
                type: streamType
            });
            player.load();
            
            // Trigger Auto Play
            player.play().catch(function(error) {
                console.log("Autoplay was prevented by browser. Click play manually.");
            });
        }

        // Fullscreen and Landscape Rotation Function
        function goFullScreenAndRotate() {
            var playerElement = document.getElementById('live-player');
            
            if (playerElement.requestFullscreen) {
                playerElement.requestFullscreen();
            } else if (playerElement.mozRequestFullScreen) { /* Firefox */
                playerElement.mozRequestFullScreen();
            } else if (playerElement.webkitRequestFullscreen) { /* Chrome, Safari and Opera */
                playerElement.webkitRequestFullscreen();
            } else if (playerElement.msRequestFullscreen) { /* IE/Edge */
                playerElement.msRequestFullscreen();
            }

            // Attempt to lock orientation to landscape on mobile devices
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(function(error) {
                    console.log("Screen orientation lock is not supported or rejected.");
                });
            }
        }
    </script>
