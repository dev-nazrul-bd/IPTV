<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP TV</title>
    <link rel="icon" type="image/jpeg" href="https://i.ibb.co.com/HTdNjg0k/profile-2.jpg">
    <style>

  :root {
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --text-muted: #666666;
            --border-color: #dddddd;
        }

        body {
            background-color: black;
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: ;
        }

        /* Profile Section */
        .profile-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
            text-align: center;
          padding-top: 13px;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary-color);
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.2);
            margin-bottom: 10px;
            
        }

        .profile-name {
            font-size: 24px;
            font-weight: bold;
            margin: 5px 0;
            letter-spacing: 0.5px;
            color: white;
        }



        /* ১. প্রধান কন্টেইনার যা ফ্রেমের বাইরের অংশ কেটে ফেলবে */
        .iframe-container {
            width: 100%;
            height: 1200px; /* আপনার চাহিদামতো মোট হাইট */
            overflow: hidden; /* স্ক্রলিং বন্ধ রাখবে এবং কাটা অংশ লুকাবে */
            position: relative;
            border: none;
        }

        /* ২. আইফ্রেমের পজিশন এবং নেগেটিভ মার্জিন */
        .iframe-container iframe {
            position: absolute;
            
            /* টপ মার্জিন মাইনাস (-) করে নেভবারটি উপরে লুকিয়ে ফেলা হয়েছে */
            /* নেভবারের সাইজ অনুযায়ী এই -70px টি কম-বেশি করতে পারেন */
            top: -50px; 
            
            left: 0;
            width: 100%;
            
            /* হাইট কিছুটা বাড়িয়ে দিতে হবে যাতে নিচের অংশ কেটে না যায় */
            height: calc(100% + 50px); 
            
            border: none;
        }


 /* Developer Footer */
        .developer-footer {
            margin-top: 40px;
            text-align: center;
            padding: 20px;
            border-top: gray;
            width: 100%;
            max-width: 850px;
        }

        .developer-footer p {
            margin: 6px 0;
            font-size: 14px;
            color: gray;
        }

        .developer-footer a {
            color: lightblue;
            text-decoration: none;
            font-weight: 500;
        }
        
        .developer-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>



    <!-- Profile Section -->
    <div class="profile-container">
        <!-- আপনার অরিজিনাল ছবির নাম এখানে হুবহু বসিয়ে দেওয়া হয়েছে -->
        <img src="https://i.ibb.co.com/HTdNjg0k/profile-2.jpg" alt="Dev Nazrul" class="profile-img">
        <div class="profile-name">Md Nazrul Islam</div>
    </div>



    <div class="iframe-container">
        <iframe 
            src="https://tv.asimxtech.online/search" 
            scrolling="no" 
            allowfullscreen="true" 
            webkitallowfullscreen="true" 
            mozallowfullscreen="true" 
            allow="fullscreen">
        </iframe>
    </div>




    <!-- Developer Footer -->
    <div class="developer-footer">
        <p><strong>Developer Contact:</strong> Md Nazrul Islam</p>
        <p><strong>Email:</strong> <a href="mailto:dev.nazrul.bd@gmail.com">dev.nazrul.bd@gmail.com</a></p>
    </div>


</body>
</html>
